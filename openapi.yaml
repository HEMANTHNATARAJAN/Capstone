openapi: 3.1.0
info:
  title: Book Worm E-Bookstore API
  description: "\n    OpenAPI 3.0 specification for Book Worm E-Bookstore platform.\n\
    \    Features:\n    - Member authentication & address profiles\n    - Storefront\
    \ catalog with genre filtering, authors, and reviews\n    - Dynamic delivery date\
    \ estimation\n    - Shopping cart & coupon/gift points redemption\n    - Order\
    \ checkout & 48-hour order cancellation window\n    - 1-Click 'Buy It Again' reordering\n\
    \    "
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Member & Authentication
      summary: Register
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Member & Authentication
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Member & Authentication
      summary: Logout
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/me:
    get:
      tags:
      - Member & Authentication
      summary: Get Current User Profile
      operationId: get_current_user_profile_api_v1_auth_me_get
      parameters:
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/members/addresses:
    get:
      tags:
      - Member & Profile
      summary: List Addresses
      operationId: list_addresses_api_v1_members_addresses_get
      parameters:
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressOut'
                title: Response List Addresses Api V1 Members Addresses Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Member & Profile
      summary: Create Address
      operationId: create_address_api_v1_members_addresses_post
      parameters:
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/catalog/categories:
    get:
      tags:
      - Catalog Subsystem
      summary: Get Categories
      operationId: get_categories_api_v1_catalog_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CategoryOut'
                type: array
                title: Response Get Categories Api V1 Catalog Categories Get
  /api/v1/catalog/filter-options:
    get:
      tags:
      - Catalog Subsystem
      summary: Get Filter Options
      operationId: get_filter_options_api_v1_catalog_filter_options_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptionsOut'
  /api/v1/catalog/books:
    get:
      tags:
      - Catalog Subsystem
      summary: List Books
      operationId: list_books_api_v1_catalog_books_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Category slug, e.g. 'all', 'self-help', 'mystery'
          title: Category
        description: Category slug, e.g. 'all', 'self-help', 'mystery'
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search keyword in title, author, or description
          title: Search
        description: Search keyword in title, author, or description
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by language
          title: Language
        description: Filter by language
      - name: format
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by format (Paperback, Hardcover, eBook)
          title: Format
        description: Filter by format (Paperback, Hardcover, eBook)
      - name: publisher_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by publisher/brand
          title: Publisher Id
        description: Filter by publisher/brand
      - name: min_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Price
      - name: max_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Price
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: relevance, price_asc, price_desc, rating, newest
          default: relevance
          title: Sort By
        description: relevance, price_asc, price_desc, rating, newest
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummary'
                title: Response List Books Api V1 Catalog Books Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/catalog/recommended:
    get:
      tags:
      - Catalog Subsystem
      summary: Get Recommended Books
      description: Personalized recommendations based on user order history or top
        featured titles
      operationId: get_recommended_books_api_v1_catalog_recommended_get
      parameters:
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummary'
                title: Response Get Recommended Books Api V1 Catalog Recommended Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/catalog/bestsellers:
    get:
      tags:
      - Catalog Subsystem
      summary: Get Bestsellers
      operationId: get_bestsellers_api_v1_catalog_bestsellers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BookSummary'
                type: array
                title: Response Get Bestsellers Api V1 Catalog Bestsellers Get
  /api/v1/catalog/new-launches:
    get:
      tags:
      - Catalog Subsystem
      summary: Get New Launches
      operationId: get_new_launches_api_v1_catalog_new_launches_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BookSummary'
                type: array
                title: Response Get New Launches Api V1 Catalog New Launches Get
  /api/v1/catalog/books/{book_id}:
    get:
      tags:
      - Catalog Subsystem
      summary: Get Book Detail
      operationId: get_book_detail_api_v1_catalog_books__book_id__get
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: integer
          title: Book Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/catalog/books/{book_id}/reviews:
    post:
      tags:
      - Catalog Subsystem
      summary: Add Book Review
      operationId: add_book_review_api_v1_catalog_books__book_id__reviews_post
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: integer
          title: Book Id
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/shipping/estimate-delivery:
    get:
      tags:
      - Shipping Subsystem
      summary: Estimate Delivery
      description: Calculates approximate delivery date and shipping fees
      operationId: estimate_delivery_api_v1_shipping_estimate_delivery_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEstimateOut'
  /api/v1/cart:
    get:
      tags:
      - Cart Subsystem
      summary: Get Cart
      operationId: get_cart_api_v1_cart_get
      parameters:
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cart/items:
    post:
      tags:
      - Cart Subsystem
      summary: Add To Cart
      operationId: add_to_cart_api_v1_cart_items_post
      parameters:
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cart/items/{item_id}:
    put:
      tags:
      - Cart Subsystem
      summary: Update Cart Item
      operationId: update_cart_item_api_v1_cart_items__item_id__put
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Cart Subsystem
      summary: Remove Cart Item
      operationId: remove_cart_item_api_v1_cart_items__item_id__delete
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cart/clear:
    delete:
      tags:
      - Cart Subsystem
      summary: Clear Cart
      operationId: clear_cart_api_v1_cart_clear_delete
      parameters:
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orders/checkout:
    post:
      tags:
      - Order Subsystem
      summary: Checkout
      operationId: checkout_api_v1_orders_checkout_post
      parameters:
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orders/history:
    get:
      tags:
      - Order Subsystem
      summary: List Order History
      operationId: list_order_history_api_v1_orders_history_get
      parameters:
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderOut'
                title: Response List Order History Api V1 Orders History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orders/{order_id}:
    get:
      tags:
      - Order Subsystem
      summary: Get Order By Id
      operationId: get_order_by_id_api_v1_orders__order_id__get
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: integer
          title: Order Id
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orders/{order_id}/cancel:
    post:
      tags:
      - Order Subsystem
      summary: Cancel Order
      description: Enforces the 48-hour order cancellation policy window
      operationId: cancel_order_api_v1_orders__order_id__cancel_post
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: integer
          title: Order Id
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orders/{order_id}/buy-again:
    post:
      tags:
      - Order Subsystem
      summary: Buy It Again
      description: 1-Click Buy It Again re-populates user's cart with items from past
        order
      operationId: buy_it_again_api_v1_orders__order_id__buy_again_post
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: integer
          title: Order Id
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payments/methods:
    get:
      tags:
      - Payment & Coupon Subsystem
      summary: Get Payment Methods
      operationId: get_payment_methods_api_v1_payments_methods_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PaymentMethodOut'
                type: array
                title: Response Get Payment Methods Api V1 Payments Methods Get
  /api/v1/payments/validate-coupon:
    post:
      tags:
      - Payment & Coupon Subsystem
      summary: Validate Coupon
      operationId: validate_coupon_api_v1_payments_validate_coupon_post
      parameters:
      - name: bookworm_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookworm Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponApplyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponApplyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - System
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AddressCreate:
      properties:
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        address_line:
          type: string
          title: Address Line
        city:
          type: string
          title: City
        state:
          type: string
          title: State
        pin_code:
          type: string
          title: Pin Code
        phone:
          type: string
          title: Phone
        country:
          type: string
          title: Country
          default: India
        is_default:
          type: boolean
          title: Is Default
          default: false
      type: object
      required:
      - first_name
      - last_name
      - address_line
      - city
      - state
      - pin_code
      - phone
      title: AddressCreate
    AddressOut:
      properties:
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        address_line:
          type: string
          title: Address Line
        city:
          type: string
          title: City
        state:
          type: string
          title: State
        pin_code:
          type: string
          title: Pin Code
        phone:
          type: string
          title: Phone
        country:
          type: string
          title: Country
          default: India
        is_default:
          type: boolean
          title: Is Default
          default: false
        id:
          type: integer
          title: Id
        user_id:
          type: integer
          title: User Id
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - first_name
      - last_name
      - address_line
      - city
      - state
      - pin_code
      - phone
      - id
      - user_id
      - created_at
      title: AddressOut
    AuthResponse:
      properties:
        message:
          type: string
          title: Message
        user:
          $ref: '#/components/schemas/UserOut'
      type: object
      required:
      - message
      - user
      title: AuthResponse
    AuthorOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        bio:
          anyOf:
          - type: string
          - type: 'null'
          title: Bio
        photo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Photo Url
      type: object
      required:
      - id
      - name
      title: AuthorOut
    BookDetail:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        subtitle:
          anyOf:
          - type: string
          - type: 'null'
          title: Subtitle
        author_name:
          type: string
          title: Author Name
        publisher_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Publisher Name
        category_name:
          type: string
          title: Category Name
        category_slug:
          type: string
          title: Category Slug
        format:
          type: string
          title: Format
        language:
          type: string
          title: Language
        price:
          type: number
          title: Price
        original_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Original Price
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        cover_image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Cover Image Url
        rating:
          type: number
          title: Rating
        rating_count:
          type: integer
          title: Rating Count
        sales_count:
          type: integer
          title: Sales Count
        tentative_delivery_date:
          type: string
          title: Tentative Delivery Date
        is_recommended:
          type: boolean
          title: Is Recommended
        is_bestseller:
          type: boolean
          title: Is Bestseller
        is_new_launch:
          type: boolean
          title: Is New Launch
        about_author_summary:
          anyOf:
          - type: string
          - type: 'null'
          title: About Author Summary
